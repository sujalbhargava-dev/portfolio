<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Sujal Bhargava</title>
  <meta name="description" content="Create a new account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-wrapper {
      max-width: 440px;
      margin: 0 auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: var(--card-shadow-md);
      position: relative;
      overflow: hidden;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 1rem;
      color: var(--text-primary);
      background: var(--bg);
      transition: var(--transition);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .form-submit {
      width: 100%;
      padding: 14px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 32px;
    }

    .form-submit:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .form-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .auth-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .auth-link a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    
    .auth-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <nav>
    <div class="nav-container" style="justify-content: center;">
      <a href="index.html" class="nav-logo">SB<span>.</span></a>
    </div>
  </nav>

  <div class="page">
    <div class="section">
      <div class="login-wrapper fade-up">
        <div class="section-header" style="text-align: center; margin-bottom: 30px;">
          <h1 class="section-title">Create Account</h1>
          <p class="section-desc" style="margin: 0 auto;">Sign up to access the developer dashboard.</p>
        </div>

        <form>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="form-submit">
            <i class="fa-solid fa-user-plus"></i> Create Account
          </button>
        </form>
        
        <div class="auth-link">
          Already have an account? <a href="login.html">Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Designed &amp; Built by <a href="index.html">Sujal Bhargava</a> &nbsp;&middot;&nbsp; &copy; 2025</p>
  </footer>

  <script src="script.js"></script>
  <script>
    const registerForm = document.querySelector('form');
    if (registerForm) {
      registerForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const submitBtn = document.querySelector('.form-submit');
        const originalText = submitBtn.innerHTML;
        
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';
        submitBtn.disabled = true;

        try {
          const response = await fetch('http://localhost:3000/api/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });
          
          const data = await response.json();
          
          if (response.ok && data.success) {
            // Automatically log them in after registration
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('isAdmin', 'false');
            window.location.href = 'index.html';
          } else {
            alert(data.error || 'Failed to create account');
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
          }
        } catch (error) {
          alert('Failed to connect to the server');
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
